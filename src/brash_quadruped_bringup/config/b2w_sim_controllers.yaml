controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_position_controller:
      type: position_controllers/JointGroupPositionController

    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

joint_position_controller:
  ros__parameters:
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
    interface_name: position

velocity_controller:
  ros__parameters:
    joints:
      - FL_wheel_joint
      - FR_wheel_joint
      - RL_wheel_joint
      - RR_wheel_joint
    interface_name: velocity
